name: Variables and Secrets
on: [push]

jobs:
    log-vars:
        runs-on: ${{var.JOBS_RUNNER}}
        env:
            BOOLEAN_SECRET: ${{ secrets.REPO_LEVEL_SECRET }}
            ENV_LEVEL_VAR: ${{ var.ENV_LEVEL_VAR }}
            REPO_LEVEL_VAR: ${{ var.REPO_LEVEL_VAR }}
        steps:
            - name: RUN Only if BOOLEAN SECRET is true
              if: env.BOOLEAN_SECRET == 'true'
              run: echo "This step runs only if the BOOLEAN_SECRET is true"