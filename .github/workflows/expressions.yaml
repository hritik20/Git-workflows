name: Expressions & Context
on: [push, pull_request, workflow_dispatch,issues]
run-name: "Expressions & contexts by ${{ github.actor }}"
jobs:
    runs-on-issues-and-prs:
        runs-on: ubuntu-latest
        if: contains(fromJson('["issues","pull_request"]'), github.event_name)
        steps:
          - name: Run on issues and pull requests
            if: contains(github.event.issue.labels.*.name, 'bug')
            run: echo ${{join(github.event.issue.labels.*.name, ', ')}}
    using-expressions:
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'push' }}
        steps:
          - name: Using expressions
            run: |
                echo ${{ 1 }}
                echo ${{ 'This is a string' }}
                echo ${{ true }}
                echo ${{ false }}
                echo ${{ null }}
                echo ${{ 1 < 2}}
                echo ${{ 'string' == 'String'}}
                echo ${{ true && false}}
                echo ${{ secrets.GITHUB_TOKEN }}
                echo ${{ github.event_name }}

          - name: Dump contexts
            run: |
                echo 'GITHUB_CONTEXT: ${{ toJson(github) }}'
                echo 'ENV_CONTEXT: ${{ toJson(env) }}'
                echo 'RUNNER_CONTEXT: ${{ toJson(runner) }}'
