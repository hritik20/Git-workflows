name: Matrix
on: [push]

jobs:
  node-matrix:
    continue-on-error: false
    strategy:
      matrix:
        node-version: [14, 16, 18]
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            is-ubuntu: true
            node-version: 18
          - experimental: false
          - os: ubuntu-latest
            node-version: 16
            experimental: false
          - os: ubuntu-latest
            node-version: 17
            
        exclude:
          - node-version: 14
            os: windows-latest
            
      fail-fast:  false
      max-parallel: 4
    runs-on: ${{ matrix.os }}
    steps:
      - if: matrix.experimental == true
        run: exit 1
      - run: node -v

      - run: echo '${{toJson(matrix)}}'
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: node -v
      - run: echo '${{toJson(matrix)}}'
        