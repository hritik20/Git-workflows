name: Concurrency 1
run-name: Concurrency 1 (${{inputs.environment}})
on:
    workflow_dispatch:
        inputs:
          environment:
            description: "Enviroment"
            type: environment
            required: true

#concurrency: concurrency1
concurrency:
  #group: concurrency1
  group: ${{ github.event.inputs.environment }}
  cancel-in-progress: true
jobs:
    sleep:
        runs-on: ubuntu-latest
        steps:
          - run: sleep 30