name: events
on: 
    push:
       branches:
         - main
         - "feature/*"
         - "feature/**"
         - "!bugfix/*"
        #branches-ignore:
         #- develop
         #- "docs/**"
       tags:
          - v1.* #match v1.1,v1.1.2
          - "!v1.1.1"
       paths:
            - "**.js"
            - "!app.js"
    pull_request:
        types: [opened, synchronize, reopened]
    issues:
        types: [opened]

jobs:
  display-event-info:
    runs-on: ubuntu-latest
    steps:
      - name: Display event information
        run: |
          echo $GITHUB_SHA
          echo $GITHUB_REF
      - uses: actions/checkout@v4
      - name: command_execute
        run: |
             ls -a
             
